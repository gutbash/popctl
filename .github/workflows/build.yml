name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build popctl.asi
        shell: pwsh
        run: .\build.ps1

      - name: Report hash
        shell: pwsh
        run: |
          $asi = Get-Item .\popctl.asi
          "built {0} ({1} bytes)" -f $asi.Name, $asi.Length
          (Get-FileHash .\popctl.asi -Algorithm SHA256).Hash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: popctl
          path: |
            popctl.asi
            popctl.ini
            README.md
            LICENSE
