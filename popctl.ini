; popctl.asi - population control for GTA IV: The Complete Edition (1.2.0.59)
; Every value here is stock unless noted. Log: popctl.log next to the .asi.

[popctl]
; Ambient ped keep radius, in metres. Peds farther than these from the player are deleted by the
; population manager. "Far" is the branch the game uses for peds it considers in view, "near" is the
; other one. Stock: 80 and 15. Raising them keeps crowds alive down the street; every kept ped costs
; main-thread CPU, so this is the setting to lower first if your frame time suffers.
FarKeepMetres = 120
NearKeepMetres = 45

; Ambient spawn attempts per frame. Stock 8. The population manager only gathers up to 16 candidate
; nodes per frame, so values above 16 do nothing at all; 16 simply doubles the fill rate.
SpawnsPerFrame = 16

; Vehicle population statics (the CVehiclePopulation block at RVA 0xC3FF60 on 1.2.0.59).
;   name = RVA,type,stock,new       type f = float, i = int32, c = 32-bit immediate inside code
; A value is written only if the global still reads its stock value, so a different game build is a
; no-op rather than a crash. Delete a line to leave that static alone.
[Pokes]
; Far edge of the ambient car generation band (stock 60..110 m). Farther = traffic visible down the avenue.
VehGenFar = C3FF70,f,110,160
; Off-view removal distance scale (stock 65 m, scaled by distance/200). Higher keeps traffic alive longer.
VehRemoveScale = C3FF90,f,65,100
; The 56 m removal test.
VehRemoveNear = C3FF64,f,56,80
; Ambient car budget. Stock 100. The CVehicle pool has 140 slots and the factory returns NULL past that,
; which the population code dereferences without checking: 160 crashes. Do not go near 140.
VehMaxCars = C3FF98,i,100,110
; Spawn attempts per frame = 3.5 x 1.1 x car multiplier (stock 3 attempts).
VehAttemptScale = C3FFA8,f,3.5,5.0
