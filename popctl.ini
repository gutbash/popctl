; popctl.asi - population control for GTA IV: The Complete Edition (1.2.0.59)
; Every value here is annotated with the stock value. Log: popctl.log next to the .asi.

[popctl]
; --- what actually makes the crowd vanish -------------------------------------------------------
; Ambient peds beyond roughly 30 m are not full peds. They live in a separate pool of lightweight
; "far ped" entities (150 slots) and are swapped for a real ped as you walk up. When that pool has
; fewer than 12 free slots, the game deletes the farthest far peds in batches of up to 20 per frame,
; whether or not you can see them. On a busy street the pool is full nearly all the time, so the
; crowd is cut off at whatever distance the 138th-farthest ped happens to stand: measured at a
; median 74 m, and as close as 5 m. popctl replaces that cull with one that has the same budget but
; only ever takes peds the camera cannot see. There is no setting for it; it is the fix. (Growing
; the pool instead was tried and crashes: at least two further pools are sized to it.)
;
; The consequence to understand: 150 far-ped slots are all there is. Whatever you keep in view is
; taken from what can stand behind you. When the pool is full, the farthest off-camera peds go
; first, so turning around shows the crowd thinning with distance rather than the full street.

; The far-ped pool size. Stock 150. popctl grows it before the game creates it, together with the
; twelve pools the engine sizes to the ped count (ped records 120+150, CAnimBlender / CDummyTask /
; Event at 300, the animation pools at multiples of 300). Every immediate is verified against its
; stock value first; if any one does not match, none are written and popctl.log says so. 300 ran
; clean for a full session on a busy Star Junction. 450 filled and then broke physics: peds and the
; player jittered vertically and fell through the map, which is what a starved frame budget does to
; the collision step. Stay at 300 unless you are measuring.
FarPedPool = 300

; Peds farther than this from the player are deleted after a 2.5-3.5 s grace period even if they are
; on screen (peds the game has flagged as seen get 1.5x this). This is the visible cull radius.
; Stock 115. Two things to know before raising it further: the spawner places new peds 55-105 m out,
; so a kept crowd deeper than that shows groups appearing inside it; and far peds past the texture
; streaming range render as untextured grey models, which stock never let you get close to seeing.
; Lower this if either bothers you more than the crowd depth.
VisibleKeepMetres = 130

; Peds the camera cannot see are deleted beyond this. Two engine paths share it: an immediate cull of
; peds it had flagged as seen (stock 80), and the timed cull of ones it never flagged (stock 70).
; Set equal to VisibleKeepMetres so that the only thing removing peds behind you is pool pressure,
; which takes the farthest first; lower it to give the view more of the pool.
HiddenKeepMetres = 130

; Peds the camera cannot see AND the game never flagged as seen - ones that spawned behind you - are
; deleted beyond this, immediately. Stock 15. Same reasoning as above.
NearKeepMetres = 130

; Ambient spawn attempts per frame. Stock 8. The population manager only gathers up to 16 candidate
; nodes per frame, so values above 16 do nothing. Left at stock: with the pool as the limit, a higher
; rate only churns it faster.
SpawnsPerFrame = 8

; Write one line per deleted ped to popctl_trace.log (which cull path, distance from the player, on
; camera or not, pool fill). This is how the numbers above were measured. Costs a file write per
; deletion; leave it off for play.
TraceRemovals = 0

; Vehicle population statics (the CVehiclePopulation block at RVA 0xC3FF60 on 1.2.0.59).
;   name = RVA,type,stock,new       type f = float, i = int32, c = 32-bit immediate inside code
; A value is written only if the global still reads its stock value, so a different game build is a
; no-op rather than a crash. Delete a line to leave that static alone.
[Pokes]
; Far edge of the ambient car generation band (stock 60..110 m). Farther = traffic visible down the avenue.
VehGenFar = C3FF70,f,110,160
; Off-view removal distance scale (stock 65 m, scaled by distance/200). Higher keeps traffic alive longer
; behind you; the vehicle pool (140, budget below) is the limit, as with peds.
VehRemoveScale = C3FF90,f,65,100
; The 56 m removal test.
VehRemoveNear = C3FF64,f,56,80
; Ambient car budget. Stock 100. The CVehicle pool has 140 slots and the factory returns NULL past that,
; which the population code dereferences without checking: 160 crashes. Do not go near 140.
VehMaxCars = C3FF98,i,100,110
; Spawn attempts per frame = 3.5 x 1.1 x car multiplier (stock 3 attempts).
VehAttemptScale = C3FFA8,f,3.5,5.0

; Ped spawn band, from the CPopulation tunables block at 0xC45900. On foot the spawner places peds
; between these two distances from the population centre (stock 55..105 m). With the crowd kept to
; 130 m, a 105 m far edge means new groups appear inside the crowd you are looking at; matching it to
; VisibleKeepMetres moves that pop-in to the edge. The near edge is left alone: spawning closer is
; more visible, not less.
PedSpawnFar = C45980,f,105,130
;PedSpawnNear = C4597C,f,55,90
